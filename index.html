<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gameday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F4F7F9;
    --dim:#828E9B;
    --void:#06080B;
    --away:#1B2733;
    --home:#1B2733;
    --live:#3DDC84;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    height:100%;
    height:100vh;
    height:100dvh;
    background:var(--void);overflow:hidden;
    font-family:"Barlow Condensed","Arial Narrow",Helvetica,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;
    user-select:none;
  }

  #app{
    flex:1 1 auto;
    display:flex;flex-direction:column;
    min-height:0;
  }

  /* ---- Score field: two color-bled halves ---- */
  .field{
    flex:1 1 auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    position:relative;
    min-height:0;
  }
  .side{
    position:relative;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:.2em;
    transition:background 600ms ease;
  }
  .side.away{background:linear-gradient(180deg,var(--away) 0%,var(--void) 92%);}
  .side.home{background:linear-gradient(180deg,var(--home) 0%,var(--void) 92%);}
  .side.dark{filter:saturate(.35) brightness(.62);}

  .crest{
    height:clamp(58px,min(12vh,9.5vw),110px);
    width:auto;object-fit:contain;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));
  }
  .abbr{
    font-size:clamp(34px,min(7.5vh,6vw),68px);
    font-weight:600;letter-spacing:.06em;
    line-height:1;
  }
  .record{font-size:clamp(20px,min(3.6vh,2.9vw),31px);color:var(--dim);line-height:1;}
  .score{
    font-size:clamp(122px,min(34vh,27vw),408px);
    font-weight:700;line-height:.82;
    letter-spacing:-.02em;
  }

  /* possession: a lit rail under the team that has the ball */
  .rail{
    position:absolute;left:8%;right:8%;bottom:0;height:6px;
    border-radius:3px;background:transparent;
    transition:background 400ms ease;
  }
  .rail.on{background:var(--live);box-shadow:0 0 18px var(--live);}

  .divider{
    position:absolute;top:12%;bottom:12%;left:50%;width:1px;
    background:linear-gradient(180deg,transparent,rgba(255,255,255,.16),transparent);
  }

  /* ---- Situation band ---- */
  .band{
    flex:0 0 auto;
    border-top:1px solid rgba(255,255,255,.09);
    padding:clamp(10px,2.2vh,22px) clamp(16px,3vw,40px);
    display:flex;flex-direction:column;gap:.35em;
    background:#0B0F14;
  }
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:1.5em;}
  .situation{
    font-size:clamp(37px,min(8.5vh,6.8vw),78px);font-weight:600;line-height:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .clock{
    font-size:clamp(37px,min(8.5vh,6.8vw),78px);font-weight:700;line-height:1;
    white-space:nowrap;
  }
  .clock .q{color:var(--dim);font-weight:500;margin-right:.35em;}
  .lastplay{
    font-size:clamp(24px,min(4.4vh,3.5vw),37px);color:var(--dim);font-weight:500;
    line-height:1.25;max-height:2.5em;overflow:hidden;
  }
  .lastplay.alert{
    font-size:clamp(28px,min(5.6vh,4.4vw),46px);
    color:var(--live);font-weight:700;
  }
  .redzone .situation{color:#FF5A4E;}

  /* ---- Fantasy totals: secondary to the alert, small and quiet ---- */
  .totals{
    display:flex;justify-content:space-between;gap:1.5em;
    font-size:clamp(18px,min(3.2vh,2.6vw),28px);
    font-weight:600;color:var(--dim);
  }
  .totals .lead{color:var(--live);}

  /* ---- States ---- */
  .msg{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:.5em;text-align:center;
    padding:0 8vw;
  }
  .msg h1{font-size:clamp(51px,min(12vh,9.5vw),109px);font-weight:600;line-height:1.05;}
  .msg p{font-size:clamp(27px,min(5.1vh,4vw),44px);color:var(--dim);font-weight:500;}

  .pulse{
    position:fixed;top:10px;right:12px;
    width:8px;height:8px;border-radius:50%;
    background:var(--dim);opacity:.5;
  }
  .pulse.live{background:var(--live);opacity:1;}
  @media (prefers-reduced-motion:no-preference){
    .pulse.live{animation:beat 2.4s ease-in-out infinite;}
  }
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</head>
<body>
  <div id="app"></div>
  <div class="pulse" id="pulse"></div>

<script>
(function(){
  "use strict";

  // ---- config via URL: ?team=IND&league=football/nfl -------------------
  var qs      = new URLSearchParams(location.search);
  var TEAM    = (qs.get("team")   || "IND").toUpperCase();
  var LEAGUE  = (qs.get("league") || "football/nfl").replace(/^\/|\/$/g,"");
  var API     = "https://site.api.espn.com/apis/site/v2/sports/" + LEAGUE + "/scoreboard";

  // ---- optional fantasy alerts: ?sleeper=evanspears&league_id=123 ------
  var SLEEPER_USER  = qs.get("sleeper") || null;
  var LEAGUE_ID_QS  = qs.get("league_id") || null;
  var SLEEPER_API   = "https://api.sleeper.app/v1";
  var PLAYERS_URL   = "players.json";

  var app   = document.getElementById("app");
  var pulse = document.getElementById("pulse");
  var timer = null;
  var fantasyTimer = null;
  var lastEv    = null;   // most recent event, for forcing a redraw when an alert decays
  var liveState = null;   // mirrors the score screen's live/pre/post state, for fantasy polling

  var fantasy = {
    ready: false,
    rosterMap: {},      // player_id -> {name, team, pos}, only players on the user's roster
    ownerByRoster: {},  // roster_id -> owner_id, for labeling the opponent
    ownerNames: {},     // user_id -> display_name
    leagueId: null,
    rosterId: null,
    week: null,
    meLabel: "Me",
    totals: null,        // {me, opp, oppLabel}
    alert: null,          // {text, until}
    lastSeenPlayText: ""
  };

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  // ESPN gives colors as bare hex, no #.
  function lum(hex){
    if(!hex || !/^[0-9a-f]{6}$/i.test(hex)) return -1;
    return 0.299*parseInt(hex.slice(0,2),16) +
           0.587*parseInt(hex.slice(2,4),16) +
           0.114*parseInt(hex.slice(4,6),16);
  }

  // Some teams (Giants, Raiders, Sox) list black as their primary, which reads as
  // an empty half of the screen. Swap to the alternate when the primary is too dark.
  function field(team){
    team = team || {};
    var hex = team.color, L = lum(hex);
    if(L < 45 && lum(team.alternateColor) > L) hex = team.alternateColor;
    if(lum(hex) < 0) return "#1B2733";
    var k = 0.34;
    return "rgb(" + Math.round(parseInt(hex.slice(0,2),16)*k) + "," +
                    Math.round(parseInt(hex.slice(2,4),16)*k) + "," +
                    Math.round(parseInt(hex.slice(4,6),16)*k) + ")";
  }

  // ---- fantasy: name normalization + matching --------------------------
  // ESPN writes plays as prose, Sleeper stores structured names. Normalize hard
  // (casefold, strip punctuation/suffixes) and match on last name + first
  // initial. A false positive is worse than a miss, so ambiguous -> nothing.
  function normalizeName(s){
    return String(s || "")
      .toLowerCase()
      .replace(/'/g, "")
      .replace(/\./g, " ")  // "J.Taylor" -> "j taylor", not "jtaylor" (would eat the word boundary)
      .replace(/\b(jr|sr|ii|iii|iv)\b/g, "")
      .replace(/[^a-z0-9\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function matchFantasyPlay(text, awayAbbr, homeAbbr){
    if(!fantasy.ready || !text) return null;
    var norm = normalizeName(text);
    var candidates = [];
    for(var pid in fantasy.rosterMap){
      var p = fantasy.rosterMap[pid];
      if(p.team === awayAbbr || p.team === homeAbbr) candidates.push(p);
    }
    var hits = candidates.filter(function(p){
      var parts = normalizeName(p.name).split(" ");
      var last  = parts[parts.length - 1];
      if(!last) return false;
      var escLast = last.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      if(!(new RegExp("\\b" + escLast + "\\b")).test(norm)) return false;
      // If a single-letter initial sits immediately before the last name (e.g.
      // "j taylor", from "J.Taylor"), it must match this candidate's initial —
      // a *contradicting* initial is a hard reject, not a weaker signal. No
      // adjacent initial at all falls back to last name + team scope.
      var initMatch = norm.match(new RegExp("\\b([a-z])\\s+" + escLast + "\\b"));
      var first = parts[0];
      if(initMatch && first) return initMatch[1] === first.charAt(0);
      return true;
    });
    if(hits.length === 1){
      console.debug("[fantasy] matched", hits[0].name, "in:", text);
      return hits[0];
    }
    console.debug(hits.length > 1
      ? "[fantasy] ambiguous, showing nothing: " + text
      : "[fantasy] no match: " + text);
    return null;
  }

  // ---- fantasy: session setup (cached) + matchup polling ---------------
  function setupFantasy(){
    fetch(SLEEPER_API + "/state/nfl")
      .then(function(r){ return r.json(); })
      .then(function(state){
        fantasy.week = state.week;
        return fetch(SLEEPER_API + "/user/" + encodeURIComponent(SLEEPER_USER))
          .then(function(r){ return r.json(); })
          .then(function(user){
            if(!user || !user.user_id) throw new Error("no such sleeper user");
            return fetch(SLEEPER_API + "/user/" + user.user_id + "/leagues/nfl/" + state.season)
              .then(function(r){ return r.json(); })
              .then(function(leagues){
                leagues = leagues || [];
                var league = LEAGUE_ID_QS
                  ? leagues.find(function(l){ return l.league_id === LEAGUE_ID_QS; })
                  : leagues[0];
                if(!league) throw new Error("no matching sleeper league");
                fantasy.leagueId = league.league_id;
                return Promise.all([
                  fetch(SLEEPER_API + "/league/" + fantasy.leagueId + "/rosters").then(function(r){ return r.json(); }),
                  fetch(SLEEPER_API + "/league/" + fantasy.leagueId + "/users").then(function(r){ return r.json(); }),
                  fetch(PLAYERS_URL).then(function(r){ return r.json(); })
                ]).then(function(results){
                  var rosters     = results[0] || [];
                  var users       = results[1] || [];
                  var playersData = results[2] || {};
                  var mine = rosters.find(function(r){ return r.owner_id === user.user_id; });
                  if(!mine) throw new Error("no roster for this user in league");
                  fantasy.rosterId = mine.roster_id;
                  (mine.players || []).forEach(function(pid){
                    if(playersData[pid]) fantasy.rosterMap[pid] = playersData[pid];
                  });
                  rosters.forEach(function(r){ fantasy.ownerByRoster[r.roster_id] = r.owner_id; });
                  users.forEach(function(u){ fantasy.ownerNames[u.user_id] = u.display_name || "Opponent"; });
                  fantasy.ready = true;
                  pollFantasy();
                });
              });
          });
      })
      .catch(function(err){
        console.debug("[fantasy] setup failed, running without it:", err && err.message);
      });
  }

  function pollFantasy(){
    if(!fantasy.ready) return;
    fetch(SLEEPER_API + "/league/" + fantasy.leagueId + "/matchups/" + fantasy.week)
      .then(function(r){ return r.json(); })
      .then(function(matchups){
        matchups = matchups || [];
        var mine = matchups.find(function(m){ return m.roster_id === fantasy.rosterId; });
        var opp  = mine && matchups.find(function(m){
          return m.matchup_id === mine.matchup_id && m.roster_id !== fantasy.rosterId;
        });
        if(mine && opp){
          var oppOwnerId = fantasy.ownerByRoster[opp.roster_id];
          fantasy.totals = {
            me: Number(mine.points) || 0,
            opp: Number(opp.points) || 0,
            oppLabel: fantasy.ownerNames[oppOwnerId] || "Opponent"
          };
          if(lastEv) render(lastEv);
        }
      })
      .catch(function(err){
        console.debug("[fantasy] matchup poll failed:", err && err.message);
      })
      .then(function(){
        clearTimeout(fantasyTimer);
        fantasyTimer = setTimeout(pollFantasy, liveState === "in" ? 30000 : 300000);
      });
  }

  function pickGame(events){
    if(!Array.isArray(events)) return null;
    var live = null, next = null, done = null;
    for(var i=0;i<events.length;i++){
      var ev = events[i];
      var comp = ev.competitions && ev.competitions[0];
      if(!comp || !comp.competitors) continue;
      var mine = comp.competitors.some(function(c){
        return c.team && String(c.team.abbreviation||"").toUpperCase() === TEAM;
      });
      if(!mine) continue;
      var state = ev.status && ev.status.type && ev.status.type.state;
      if(state === "in")   { live = ev; break; }
      if(state === "pre")  { if(!next) next = ev; }
      if(state === "post") { done = ev; }
    }
    return live || next || done;
  }

  function render(ev){
    var comp   = ev.competitions[0];
    var away   = comp.competitors.find(function(c){return c.homeAway === "away";}) || comp.competitors[1];
    var home   = comp.competitors.find(function(c){return c.homeAway === "home";}) || comp.competitors[0];
    var status = ev.status || {};
    var type   = status.type || {};
    var state  = type.state;
    var sit    = comp.situation || {};

    document.documentElement.style.setProperty("--away", field(away.team));
    document.documentElement.style.setProperty("--home", field(home.team));

    var hasBall = sit.possession != null ? String(sit.possession) : null;
    var pre     = state === "pre";
    var post    = state === "post";

    function sideHTML(c, cls){
      var t   = c.team || {};
      var rec = (c.records && c.records[0] && c.records[0].summary) || "";
      var ball = hasBall && String(t.id) === hasBall;
      var dim  = post && Number(c.score) < Number(cls === "away" ? home.score : away.score);
      return '<div class="side ' + cls + (dim ? " dark" : "") + '">' +
               (t.logo ? '<img class="crest" src="' + esc(t.logo) + '" alt="">' : "") +
               '<div class="abbr">' + esc(t.abbreviation || t.shortDisplayName || "") + '</div>' +
               (rec ? '<div class="record">' + esc(rec) + '</div>' : "") +
               '<div class="score">' + (pre ? "" : esc(c.score)) + '</div>' +
               '<div class="rail' + (ball ? " on" : "") + '"></div>' +
             '</div>';
    }

    // situation line
    var left = "", right = "";
    if(pre){
      var d = new Date(ev.date);
      left  = esc(ev.shortName || "");
      right = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    } else if(post){
      left  = "Final";
      right = esc(type.shortDetail || "");
    } else {
      // Only football has a down, a quarter, and a running clock. Baseball, soccer
      // and everything else describe themselves fine in shortDetail ("End 7th").
      var clocked = /football/.test(LEAGUE) && status.displayClock && status.displayClock !== "0:00";
      left  = esc(sit.downDistanceText || "");
      right = clocked
        ? '<span class="q">Q' + esc(status.period) + '</span>' + esc(status.displayClock)
        : esc(type.shortDetail || type.detail || "");
    }

    var rawLastPlay = (sit.lastPlay && sit.lastPlay.text) ? sit.lastPlay.text : "";
    var redzone     = sit.isRedZone ? " redzone" : "";

    // A genuinely new play: check it against the user's roster. Re-rendering the
    // same play (e.g. when a fantasy poll forces a redraw) must not re-trigger it.
    if(rawLastPlay && rawLastPlay !== fantasy.lastSeenPlayText){
      fantasy.lastSeenPlayText = rawLastPlay;
      var hit = matchFantasyPlay(rawLastPlay, away.team && away.team.abbreviation, home.team && home.team.abbreviation);
      if(hit){
        fantasy.alert = {text: hit.name.toUpperCase() + "  " + rawLastPlay, until: Date.now() + 20000};
        setTimeout(function(){ if(lastEv) render(lastEv); }, 20000);
      }
    }

    var alertActive = fantasy.alert && Date.now() < fantasy.alert.until;
    var lastPlayHTML;
    if(alertActive){
      lastPlayHTML = '<div class="lastplay alert">' + esc(fantasy.alert.text) + '</div>';
    } else {
      fantasy.alert = null;
      // Don't echo the status line back as a "last play".
      var flat = String(left + right).replace(/<[^>]*>/g,"").toLowerCase();
      var displayPlay = flat.indexOf(rawLastPlay.toLowerCase().slice(0,12)) !== -1 ? "" : rawLastPlay;
      lastPlayHTML = displayPlay ? '<div class="lastplay">' + esc(displayPlay) + '</div>' : "";
    }

    var totalsHTML = "";
    if(fantasy.totals){
      var meLead = fantasy.totals.me >= fantasy.totals.opp;
      totalsHTML = '<div class="totals">' +
        '<span class="' + (meLead ? "lead" : "") + '">' + esc(fantasy.meLabel) + " " + fantasy.totals.me.toFixed(1) + '</span>' +
        '<span class="' + (meLead ? "" : "lead") + '">' + esc(fantasy.totals.oppLabel) + " " + fantasy.totals.opp.toFixed(1) + '</span>' +
      '</div>';
    }

    app.innerHTML =
      '<div class="field">' + sideHTML(away,"away") + '<div class="divider"></div>' + sideHTML(home,"home") + '</div>' +
      '<div class="band' + redzone + '">' +
        '<div class="row"><div class="situation">' + left + '</div><div class="clock">' + right + '</div></div>' +
        lastPlayHTML + totalsHTML +
      '</div>';

    pulse.className = "pulse" + (state === "in" ? " live" : "");
    return state;
  }

  function message(head, sub){
    app.innerHTML = '<div class="msg"><h1>' + esc(head) + '</h1>' +
                    (sub ? '<p>' + esc(sub) + '</p>' : "") + '</div>';
    pulse.className = "pulse";
  }

  function tick(){
    fetch(API, {cache:"no-store"})
      .then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(data){
        var ev = pickGame(data.events);
        if(ev){
          lastEv = ev;
          liveState = render(ev);
        } else {
          liveState = null;
          message("No " + TEAM + " game today", "This screen wakes up on gameday.");
        }
        schedule(liveState === "in" ? 20000 : 300000);
      })
      .catch(function(){
        message("Can't reach scores", "Retrying in 30 seconds. Check the car's connection.");
        schedule(30000);
      });
  }

  function schedule(ms){
    clearTimeout(timer);
    timer = setTimeout(tick, ms);
  }

  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) tick();
  });

  message("Loading", TEAM);
  tick();
  if(SLEEPER_USER) setupFantasy();
})();
</script>
</body>
</html>
